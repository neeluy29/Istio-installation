kind: CronJob
schedule: "*/5 * * * *"          # check every 5 minutes

resources:                        # chart default is 500m CPU – too much for our 2 small nodes
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

deschedulerPolicy:
  profiles:
    - name: rebalance-replicas
      pluginConfig:
        - name: DefaultEvictor
          args:
            nodeFit: true                # only evict if the pod fits on another node (no Pending pods)
            evictLocalStoragePods: true  # Istio sidecars use emptyDir; without this our pods are never evicted
        - name: RemoveDuplicates         # 2+ copies of the same Deployment on one node -> move one
          args:
            namespaces:
              include: ["dev", "istio-ingress"]
        - name: RemovePodsViolatingTopologySpreadConstraint   # enforce our DoNotSchedule spread rule after the fact
          args:
            constraints: ["DoNotSchedule"]
            namespaces:
              include: ["dev"]
      plugins:
        balance:
          enabled:
            - RemoveDuplicates
            - RemovePodsViolatingTopologySpreadConstraint