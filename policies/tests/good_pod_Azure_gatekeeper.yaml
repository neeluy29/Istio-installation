
apiVersion: v1
kind: Pod
metadata:
  name: cap-test-good
  namespace: dev
spec:
  containers:
  - name: app
    image: busybox:1.36.1
    command: ["sleep","3600"]
    securityContext:
      capabilities:
        add: ["NET_BIND_SERVICE"]
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 50m, memory: 32Mi}
