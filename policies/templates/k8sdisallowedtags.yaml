# ConstraintTemplate: container images must be pinned - no missing tag and no disallowed tag (e.g. latest).
# Digest-pinned images (repo@sha256:...) are allowed. Registry ports (myreg:5000/app) are not treated as tags.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowedtags
  annotations:
    description: Disallows container images without a tag or with a tag from the given list.
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowedTags
      validation:
        openAPIV3Schema:
          type: object
          properties:
            tags:
              type: array
              description: Image tags that are not allowed, e.g. ["latest"]
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowedtags

        containers[c] { c := input.review.object.spec.containers[_] }
        containers[c] { c := input.review.object.spec.initContainers[_] }
        containers[c] { c := input.review.object.spec.template.spec.containers[_] }
        containers[c] { c := input.review.object.spec.template.spec.initContainers[_] }
        containers[c] { c := input.review.object.spec.jobTemplate.spec.template.spec.containers[_] }

        # Image with no tag at all (e.g. "nginx") silently means "latest"
        violation[{"msg": msg}] {
          c := containers[_]
          not has_tag(c.image)
          msg := sprintf("container <%v> image <%v> has no tag (defaults to latest) - pin a version", [c.name, c.image])
        }

        # Image with a forbidden tag (e.g. "nginx:latest")
        violation[{"msg": msg}] {
          c := containers[_]
          tag := image_tag(c.image)
          tag == input.parameters.tags[_]
          msg := sprintf("container <%v> image <%v> uses disallowed tag <%v>", [c.name, c.image, tag])
        }

        # Digest-pinned images (repo@sha256:...) count as pinned
        has_tag(img) { contains(img, "@") }

        has_tag(img) {
          not contains(img, "@")
          contains(last_segment(img), ":")
        }

        image_tag(img) = tag {
          not contains(img, "@")
          parts := split(last_segment(img), ":")
          count(parts) > 1
          tag := parts[count(parts) - 1]
        }

        # Last path segment, so a registry port ("myreg:5000/app") is not mistaken for a tag
        last_segment(img) = s {
          parts := split(img, "/")
          s := parts[count(parts) - 1]
        }