suite: keda triggerauthentication
templates:
  - templates/keda-triggerauthentication.yaml
tests:
  - it: is not rendered when autoscaling is disabled
    set:
      autoscaling.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: uses azure workload identity when autoscaling is enabled
    set:
      autoscaling.enabled: true
    asserts:
      - isKind:
          of: TriggerAuthentication
      - equal:
          path: metadata.name
          value: keda-servicebus-auth
      - equal:
          path: spec.podIdentity.provider
          value: azure-workload