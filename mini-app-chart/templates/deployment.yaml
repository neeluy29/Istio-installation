apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-app-{{ .Values.version }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: mini-app
    version: {{ .Values.version }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: mini-app
      version: {{ .Values.version }}
  template:
    metadata:
      labels:
        app: mini-app
        version: {{ .Values.version }}
    spec:
      serviceAccountName: mini-app              # CIS 4.1.5: own identity, not "default"
      automountServiceAccountToken: false       # CIS 4.1.6: nginx never calls the Kubernetes API
      securityContext:                          # CIS 4.6.2: pod-level hardening
        seccompProfile:
          type: RuntimeDefault                  # block dangerous Linux system calls
      terminationGracePeriodSeconds: {{ .Values.gracefulShutdown.terminationGracePeriodSeconds }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable | default "ScheduleAnyway" }}
          nodeTaintsPolicy: Honor          # ignore down/cordoned nodes so recovery and drains are never blocked
          matchLabelKeys:
            - pod-template-hash            # count only pods from the same rollout
          labelSelector:
            matchLabels:
              app: mini-app
              version: {{ .Values.version }}
      {{- end }}
      containers:
        - name: mini-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:                      # CIS 4.2.5 / 4.6.2: container hardening
            allowPrivilegeEscalation: false     # no process can gain more privileges than its parent
            capabilities:
              drop: ["ALL"]                     # remove every Linux capability...
              add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]   # ...except what nginx needs
          ports:
            - containerPort: 80
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.gracefulShutdown.preStopSleepSeconds }}"]
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: 80
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: 80
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}