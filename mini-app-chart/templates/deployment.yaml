apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-app-{{ .Values.version }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: mini-app
    version: {{ .Values.version }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: mini-app
      version: {{ .Values.version }}
  template:
    metadata:
      labels:
        app: mini-app
        version: {{ .Values.version }}
    spec:
      containers:
        - name: mini-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            {{- toYaml .Values.resources | nindent 12 }}