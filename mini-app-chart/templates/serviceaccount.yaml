{{- /* CIS 4.1.5: dedicated identity for mini-app instead of the namespace "default" SA.
       Created only by the release that owns shared objects (v1, shared.create=true),
       so v1 and v2 don't both try to create the same ServiceAccount. */}}
{{- if .Values.shared.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mini-app
  namespace: {{ .Release.Namespace }}
  labels:
    app: mini-app
automountServiceAccountToken: false   # CIS 4.1.6: no API token by default
{{- end }}