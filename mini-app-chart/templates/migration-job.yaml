apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-mini-app-migration
  annotations:
    "helm.sh/hook": pre-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: busybox:1.36.1          # pinned (was busybox:stable - a moving tag like latest)
          resources:                     # required by Gatekeeper policy require-resource-limits
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          command:
            - sh
            - -c
            - |
              echo "Running DB migration against {{ .Release.Name }}-mini-db (mini-db enabled: {{ index .Values "mini-db" "enabled" }})..."
              echo "Migration step 1: creating schema (simulated)"
              echo "Migration step 2: seeding data (simulated)"
              echo "Migration complete."